<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Mobile Phone Mockup - Standalone Component</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #080B11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px 20px;
      color: #FFF;
      box-sizing: border-box;
    }
    .preview-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .preview-header h1 {
      font-size: 24px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .preview-header p {
      font-size: 13px;
      color: #94A3B8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <h1>Antigravity Flagship Phone Mockup</h1>
    <p>Componente independente em TypeScript pronto para ser embutido em qualquer página.</p>
  </div>

  <!-- Mockup Mount Point -->
  <div id="antigravity-phone-mockup"></div>

  <!-- Standalone Bundled Script -->
  <script src="dist/phone-mockup.js"></script>
</body>
</html>
